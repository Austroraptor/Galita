<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GALITA — Dachshund Dash</title><style>body{margin:0;font-family:Arial;background:#dff2d8;text-align:center}.wrap{max-width:1000px;margin:auto;padding:8px}h1{margin:8px}.info{font-size:14px}#game{position:relative;overflow:hidden;border:3px solid #333;border-radius:12px;background:#8ed5ff}canvas{display:block;width:100%;height:auto}.hud{position:absolute;top:8px;left:8px;font-weight:bold;font-size:18px;background:#ffffffb8;padding:6px;border-radius:8px}.controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:8px}.controls button{min-width:78px;min-height:56px;border:2px solid #333;border-radius:10px;background:white;font-weight:bold;font-size:16px;touch-action:none}.msg{min-height:24px}@media(max-width:700px){h1{font-size:24px}.info{line-height:1.35}}</style></head><body><div class="wrap"><h1>🐶 GALITA — Dachshund Dash</h1><div class="info">🌲 Corre por el bosque, junta huesitos y esquiva hamburguesas. 📱 Android: usá los botones.</div><div id="game"><canvas id="c" width="1000" height="500"></canvas><div class="hud">🦴 <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span></div></div><div class="controls"><button id="left">A ◀</button><button id="jump">W ⬆ SALTAR</button><button id="right">D ▶</button><button id="new">Nuevo juego</button><button id="music">🎵 Música ON</button></div><div class="msg" id="msg">¡Preparada, GALITA!</div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),dog=new Image();dog.src='https://raw.githubusercontent.com/Austroraptor/Galita/main/galita.png';let k={},p,s,l,cam,run,raf;const G=[{x:0,y:410,w:900},{x:1030,y:385,w:650},{x:1810,y:410,w:700},{x:2630,y:370,w:850}],B=[],E=[];for(let i=0;i<27;i++)B.push({x:170+i*120+Math.random()*50,y:280-Math.random()*100,t:0});for(let i=0;i<10;i++)E.push({x:550+i*300,y:350,w:58,h:55,v:1.2+Math.random(),min:430+i*280,max:820+i*280,d:0});function start(){cancelAnimationFrame(raf);s=0;l=3;cam=0;run=1;p={x:80,y:350,w:92,h:58,vx:0,vy:0,on:0,inv:0};B.forEach(b=>b.t=0);E.forEach(e=>e.d=0);document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;document.getElementById('msg').textContent='¡GALITA! A/D corre, W salta.';loop()}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function lose(){if(p.inv)return;l--;document.getElementById('lives').textContent=l;if(l<1){run=0;document.getElementById('msg').textContent='💥 Game Over. Huesitos: '+s;return}p.x=Math.max(70,p.x-350);p.y=250;p.vy=0;p.inv=100}function update(){if(!run)return;let L=k.a||k.ArrowLeft,R=k.d||k.ArrowRight,J=k.w||k.ArrowUp||k[' '];if(R)p.vx=Math.min(p.vx+.6,9);else if(L)p.vx=Math.max(p.vx-.6,-6);else p.vx*=.84;if(J&&p.on){p.vy=-13;p.on=0}p.vy=Math.min(p.vy+.6,15);let oy=p.y;p.x+=p.vx;p.y+=p.vy;p.on=0;for(const g of G)if(p.x+p.w>g.x&&p.x<g.x+g.w&&oy+p.h<=g.y&&p.y+p.h>=g.y&&p.vy>=0){p.y=g.y-p.h;p.vy=0;p.on=1}if(p.y>550){lose();return}for(const b of B)if(!b.t&&Math.hypot(p.x+p.w/2-b.x,p.y+p.h/2-b.y)<55){b.t=1;s++;document.getElementById('score').textContent=s}for(const e of E){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(!e.d&&hit(p,e)){if(p.vy>2&&p.y+p.h-e.y<25){e.d=1;p.vy=-9;s+=2;document.getElementById('score').textContent=s}else{lose();return}}}if(p.inv)p.inv--;if(p.x>3350){run=0;document.getElementById('msg').textContent='🏆 ¡GALITA completó el bosque! Huesitos: '+s}cam=Math.max(0,Math.min(p.x-280,2500));draw()}function tree(a,b,z){x.fillStyle='#70462b';x.fillRect(a-9*z,b,18*z,105*z);x.fillStyle='#286b36';for(const q of [[0,0,48],[-35,25,40],[35,25,40]]){x.beginPath();x.arc(a+q[0]*z,b+q[1]*z,q[2]*z,0,7);x.fill()}}function draw(){x.clearRect(0,0,1000,500);x.save();x.translate(-cam,0);x.fillStyle='#8ed5ff';x.fillRect(cam,0,1000,500);for(let i=Math.floor(cam/170)-2;i<Math.floor((cam+1000)/170)+4;i++)tree(i*170+80,210+(i%3)*18,.9+(i%2)*.2);for(const g of G){x.fillStyle='#4d9a42';x.fillRect(g.x,g.y,g.w,10);x.fillStyle='#79502e';x.fillRect(g.x,g.y+10,g.w,110)}for(const b of B)if(!b.t){x.fillStyle='#fff1a0';x.fillRect(b.x-14,b.y-5,28,10);x.beginPath();x.arc(b.x-14,b.y-7,7,0,7);x.arc(b.x-14,b.y+7,7,0,7);x.arc(b.x+14,b.y-7,7,0,7);x.arc(b.x+14,b.y+7,7,0,7);x.fill()}for(const q of E)if(!q.d){x.fillStyle='#d89b45';x.beginPath();x.ellipse(q.x+29,q.y+12,28,14,0,0,7);x.fill();x.fillStyle='#6e351f';x.fillRect(q.x+5,q.y+20,48,12);x.fillStyle='#55a33c';x.fillRect(q.x+3,q.y+32,52,7);x.fillStyle='#c67b32';x.fillRect(q.x+5,q.y+39,48,13)}if(!p.inv||p.inv%10<5)x.drawImage(dog,p.x,p.y,p.w,p.h);x.restore()}function loop(){update();if(run)raf=requestAnimationFrame(loop)}function bind(id,z){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();k[z]=1};['pointerup','pointercancel','pointerleave'].forEach(q=>b.addEventListener(q,()=>k[z]=0))}bind('left','a');bind('right','d');bind('jump','w');onkeydown=e=>{if(['a','A','d','D','w','W','ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();k[e.key]=1;k[e.key.toLowerCase()]=1};onkeyup=e=>{k[e.key]=0;k[e.key.toLowerCase()]=0};document.getElementById('new').onclick=start;let ac,mt,on=0;document.getElementById('music').onclick=()=>{if(on){on=0;clearInterval(mt);document.getElementById('music').textContent='🔇 Música OFF';return}on=1;ac=ac||new AudioContext();const m=[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294];let i=0;mt=setInterval(()=>{let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=m[i++%m.length];g.gain.value=.055;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.18)},260);document.getElementById('music').textContent='🎵 Música ON'};dog.onload=start;</script></body></html>
