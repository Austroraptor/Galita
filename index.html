<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>🐶 GALITA — Salchicha Runner</title><style>*{box-sizing:border-box}body{margin:0;background:#dff4ff;font-family:Arial;text-align:center;color:#222}.wrap{max-width:980px;margin:auto;padding:8px}h1{margin:6px 0;font-size:26px}.sub{font-size:14px;margin-bottom:6px}#game{position:relative;border:3px solid #222;border-radius:12px;overflow:hidden;background:#8fd8ff}canvas{display:block;width:100%;height:auto}.hud{position:absolute;left:10px;top:8px;background:#ffffffc9;border:2px solid #333;border-radius:9px;padding:5px 9px;font-weight:bold;font-size:17px}.msg{min-height:26px;margin:5px;font-weight:bold}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:2px solid #222;border-radius:10px;background:#fff;padding:11px 16px;font-weight:bold;font-size:16px;min-height:48px;touch-action:none}@media(max-width:600px){h1{font-size:22px}.sub{font-size:13px}button{min-width:100px}}</style></head><body><div class="wrap"><h1>🐶 GALITA — Salchicha Runner</h1><div class="sub">Como el dinosaurio de Chrome: corré, saltá las 🍔 hamburguesas y juntá 🦴 huesitos.</div><div id="game"><canvas id="c" width="960" height="430"></canvas><div class="hud">🦴 <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div></div><div class="msg" id="msg">¡Tocá SALTAR para empezar!</div><div class="controls"><button id="jump">W ⬆ SALTAR</button><button id="music">🎵 Música ON</button><button id="new">🔄 Nuevo juego</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),dog=new Image(),burgerImg=new Image();dog.src="https://raw.githubusercontent.com/Austroraptor/Galita/main/galita.png";burgerImg.src="https://raw.githubusercontent.com/Austroraptor/Galita/main/hambur.webp";
let player,items,score,best=Number(localStorage.galitaBest||0),speed,playing,started,spawn,clouds,musicOn=false,audio,melodyTimer;
document.getElementById('best').textContent=best;
function reset(){player={x:105,y:325,w:82,h:49,vy:0,onGround:true};items=[];score=0;speed=6;spawn=55;playing=false;started=false;clouds=[];for(let i=0;i<9;i++)clouds.push({x:i*150+Math.random()*80,y:35+Math.random()*100,s:.7+Math.random()*.8});updateHud();draw();document.getElementById('msg').textContent='¡Tocá SALTAR para empezar!'}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('best').textContent=best}
function start(){if(!started){started=true;playing=true;document.getElementById('msg').textContent='¡Corré GALITA! W / ESPACIO para saltar.';requestAnimationFrame(loop)}}
function jump(){if(!started)start();if(playing&&player.onGround){player.vy=-14;player.onGround=false}}
function hit(a,b){return a.x+12<b.x+b.w-5&&a.x+a.w-10>b.x+5&&a.y+8<b.y+b.h&&a.y+a.h-5>b.y+5}
function addItem(){const bone=Math.random()<.48;items.push({type:bone?'bone':'burger',x:970,y:bone?270+Math.random()*65:329,w:bone?42:81,h:bone?22:68,got:false})}
function update(){if(!playing)return;speed=Math.min(12,speed+.002);player.vy+=.72;player.y+=player.vy;if(player.y>=227){player.y=227;player.vy=0;player.onGround=true}for(const q of clouds){q.x-=speed*.18;if(q.x<-120){q.x=1000+Math.random()*200;q.y=30+Math.random()*120}}spawn--;if(spawn<=0){addItem();spawn=55+Math.random()*75-(speed-6)*5;if(spawn<32)spawn=32}for(const o of items)o.x-=speed;for(const o of items){if(o.type==='bone'&&!o.got&&Math.abs(player.x+player.w/2-o.x-o.w/2)<45&&Math.abs(player.y+player.h/2-o.y-o.h/2)<45){o.got=true;score++;updateHud()}if(o.type==='burger'&&!o.got&&hit(player,o)){playing=false;if(score>best){best=score;localStorage.galitaBest=best}updateHud();document.getElementById('msg').textContent='💥 ¡Hamburguesa! Puntaje: '+score+' — tocá SALTAR para volver.'}}items=items.filter(o=>o.x>-100&&!o.got)}
function cloud(q){ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.s,q.s);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,18,20,0,7);ctx.arc(22,5,28,0,7);ctx.arc(52,18,20,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,960,430);const g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'#73cfff');g.addColorStop(1,'#dff7ff');ctx.fillStyle=g;ctx.fillRect(0,0,960,430);clouds.forEach(cloud);ctx.fillStyle='#5fb34f';ctx.fillRect(0,374,960,56);ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,374);ctx.lineTo(960,374);ctx.stroke();ctx.fillStyle='#777';for(let i=0;i<960;i+=42)ctx.fillRect(i,389+(i/42%2)*8,24,3);for(const o of items)if(o.type==='bone'&&!o.got){ctx.save();ctx.translate(o.x+21,o.y+11);ctx.rotate(-.18);ctx.fillStyle='#fff3bd';ctx.fillRect(-15,-4,30,8);for(const q of [[-15,-7],[-15,7],[15,-7],[15,7]]){ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.fill()}ctx.restore()}for(const o of items)if(o.type==='burger'){if(burgerImg.complete)ctx.drawImage(burgerImg,o.x,o.y,o.w,o.h);}if(dog.complete)ctx.drawImage(dog,player.x-20,player.y-20,123,74);if(!started){ctx.fillStyle='#ffffffd9';ctx.fillRect(285,145,390,100);ctx.fillStyle='#222';ctx.font='bold 27px Arial';ctx.fillText('🐶 GALITA',405,180);ctx.font='18px Arial';ctx.fillText('Tocá SALTAR para comenzar',350,215)}}
function loop(){update();draw();if(playing)requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();jump()}});const jb=document.getElementById('jump');jb.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('new').onclick=reset;
document.getElementById('music').onclick=()=>{if(musicOn){musicOn=false;clearInterval(melodyTimer);document.getElementById('music').textContent='🔇 Música OFF';return}musicOn=true;audio=audio||new(window.AudioContext||window.webkitAudioContext)();const m=[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294];let i=0;melodyTimer=setInterval(()=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=m[i++%m.length];g.gain.value=.055;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)},260);document.getElementById('music').textContent='🎵 Música ON'};
dog.onload=()=>{reset();draw()};</script></body></html>
