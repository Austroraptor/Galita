let player,items,score,best=Number(localStorage.galitaBest||0),speed,playing,started,spawn,clouds,keys={},musicOn=false,audio,melodyTimer;
document.getElementById('best').textContent=best;

function reset(){
 player={x:105,y:325,w:82,h:49,vy:0,onGround:true};
 items=[]; score=0; speed=6; spawn=60; playing=false; started=false;
 clouds=[]; for(let i=0;i<9;i++) clouds.push({x:i*150+Math.random()*80,y:35+Math.random()*100,s:.7+Math.random()*.8});
 updateHud(); draw();
 document.getElementById('msg').textContent='¡Tocá SALTAR para empezar!';
}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('best').textContent=best}
function start(){
 if(!started){started=true;playing=true;document.getElementById('msg').textContent='¡Corré GALITA! W / ESPACIO para saltar.';requestAnimationFrame(loop)}
}
function jump(){
 if(!started) start();
 if(playing && player.onGround){player.vy=-14;player.onGround=false}
}
function rectHit(a,b){
 return a.x+12<b.x+b.w-5&&a.x+a.w-10>b.x+5&&a.y+8<b.y+b.h&&a.y+a.h-5>b.y+5;
}
function addItem(){
 const isBone=Math.random()<0.48;
 items.push({type:isBone?'bone':'burger',x:970,y:isBone?270+Math.random()*65:350,w:isBone?42:54,h:isBone?22:45,got:false});
}
function update(){
 if(!playing)return;
 speed=Math.min(12,speed+0.002);
 player.vy+=0.72; player.y+=player.vy;
 if(player.y>=325){player.y=325;player.vy=0;player.onGround=true}
 for(const cl of clouds){cl.x-=speed*.18;if(cl.x<-120){cl.x=1000+Math.random()*200;cl.y=30+Math.random()*120}}
 spawn--; if(spawn<=0){addItem();spawn=55+Math.random()*75-(speed-6)*5;if(spawn<32)spawn=32}
 for(const o of items)o.x-=speed;
 for(const o of items){
   if(o.type==='bone'&&!o.got&&Math.abs((player.x+player.w/2)-(o.x+o.w/2))<45&&Math.abs((player.y+player.h/2)-(o.y+o.h/2))<45){
     o.got=true;score++;updateHud();
   }
   if(o.type==='burger'&&!o.got&&rectHit(player,o)){
     playing=false; document.getElementById('msg').textContent='💥 ¡Hamburguesa! Puntaje: '+score+' — tocá SALTAR para volver a correr.';
     if(score>best){best=score;localStorage.galitaBest=best;updateHud()}
   }
 }
 items=items.filter(o=>o.x>-100&&!o.got);
 if(score>best){best=score;localStorage.galitaBest=best;updateHud()}
}
function drawCloud(cl){
 ctx.save();ctx.translate(cl.x,cl.y);ctx.scale(cl.s,cl.s);ctx.fillStyle='#fff';ctx.beginPath();
 ctx.arc(0,18,20,0,Math.PI*2);ctx.arc(22,5,28,0,Math.PI*2);ctx.arc(52,18,20,0,Math.PI*2);ctx.fill();ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 // cielo
 const g=ctx.createLinearGradient(0,0,0,430);g.addColorStop(0,'#73cfff');g.addColorStop(1,'#dff7ff');ctx.fillStyle=g;ctx.fillRect(0,0,960,430);
 clouds.forEach(drawCloud);
 // suelo estilo Chrome
 ctx.fillStyle='#f5f5f5';ctx.fillRect(0,374,960,56);
 ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,374);ctx.lineTo(960,374);ctx.stroke();
 ctx.fillStyle='#777';
 for(let x=0;x<960;x+=42){ctx.fillRect(x,389+(Math.floor(x/42)%2)*8,24,3)}
 // player
 if(dog.complete)ctx.drawImage(dog,player.x,player.y,player.w,player.h);
 // bones
 for(const o of items)if(o.type==='bone'&&!o.got){
   ctx.save();ctx.translate(o.x+21,o.y+11);ctx.rotate(-.18);
   ctx.fillStyle='#fff3bd';ctx.fillRect(-15,-4,30,8);
   for(const q of [[-15,-7],[-15,7],[15,-7],[15,7]]){ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.fill()}
   ctx.restore();
 }
 // hamburguesas
 for(const o of items)if(o.type==='burger'){
   ctx.fillStyle='#7b3f20';ctx.fillRect(o.x+5,o.y+25,44,9);
   ctx.fillStyle='#f0b83d';ctx.fillRect(o.x+2,o.y+19,50,8);
   ctx.fillStyle='#4d9b39';ctx.fillRect(o.x,o.y+15,54,6);
   ctx.fillStyle='#d79a43';ctx.beginPath();ctx.ellipse(o.x+27,o.y+12,27,13,0,0,7);ctx.fill();
   ctx.strokeStyle='#66351e';ctx.stroke();
   ctx.fillStyle='#5a2b19';ctx.fillRect(o.x+8,o.y+36,38,7);
 }
 if(!started){ctx.fillStyle='#ffffffd9';ctx.fillRect(285,145,390,100);ctx.fillStyle='#222';ctx.font='bold 27px Arial';ctx.fillText('🐶 GALITA',405,180);ctx.font='18px Arial';ctx.fillText('Tocá SALTAR para comenzar',350,215)}
}
function loop(){update();draw();if(playing)requestAnimationFrame(loop)}
function keydown(e){if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();jump()}}
window.addEventListener('keydown',keydown);
function bindJump(){
 const b=document.getElementById('jump');
 b.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
}
bindJump();
document.getElementById('new').onclick=reset;
document.getElementById('music').onclick=()=>{
 if(musicOn){musicOn=false;clearInterval(melodyTimer);document.getElementById('music').textContent='🔇 Música OFF';return}
 musicOn=true; audio=audio||new (window.AudioContext||window.webkitAudioContext)();
 const m=[262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294]; let i=0;
 melodyTimer=setInterval(()=>{const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=m[i++%m.length];g.gain.value=.055;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)},260);
 document.getElementById('music').textContent='🎵 Música ON';
};
dog.onload=()=>{reset();draw()};
</script>
